<h1>Medico</h1>
<!-- Filtro da tabela de reservas -->
<div class="row" [formGroup]="form">
    <div class="col-md-6">
        <mat-form-field class="input-filtro" appearance="standard" fxFlex="grow">
            <mat-label class="label">Pesquisar reserva</mat-label>
            <input matInput (keyup)="applyFilter($event)" formControlName="filtro" #input />
        </mat-form-field>
    </div>
    <div class="col">
        <mat-form-field appearance="standard" fxFlex="grow">
            <mat-label class="label">Area</mat-label>
            <mat-select formControlName="categoria">
                <mat-option value="todas">todas</mat-option>
                <mat-option value="pediatrico">Pediatrico</mat-option>
                <mat-option value="urologista">Urologista</mat-option>
                <mat-option value="clinico geral">Clinico Geral</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <div class="col">
        <mat-form-field appearance="standard" fxFlex="grow">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
                <mat-option value="todos">Todos</mat-option>
                <mat-option value="plano">Plano</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <div class="col">
        <button mat-button fxFlex="grow" class="botao-estilo">
            Limpar <mat-icon>backspace</mat-icon>
        </button>
    </div>
    <div class="col">
        <button mat-button mat-raised-button color="primary" fxFlex="grow" class="botao-adicionar">
            Adicionar <mat-icon>add</mat-icon>
        </button>
    </div>
    <div class="col">
        <button mat-button fxFlex="grow">
            <mat-icon class="grade-icon">view_module</mat-icon>
        </button>
    </div>
</div>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
            <td mat-cell *matCellDef="let medico"> {{medico.nome}} </td>
        </ng-container>

        <ng-container matColumnDef="telefone">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Telefone </th>
            <td mat-cell *matCellDef="let medico"> {{medico.telefone}} </td>
        </ng-container>

        <ng-container matColumnDef="crm">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> CRM </th>
            <td mat-cell *matCellDef="let medico"> {{medico.crm}} </td>
        </ng-container>

        <ng-container matColumnDef="plano">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Plano </th>
            <td mat-cell *matCellDef="let medico"> {{medico.plano}} </td>
        </ng-container>

        <ng-container matColumnDef="area">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Area </th>
            <td mat-cell *matCellDef="let medico"> {{medico.area}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Ações </th>
            <td mat-cell *matCellDef="let row" class="icones-acoes">
                <button mat-icon-button>
                    <mat-icon color="primary">edit</mat-icon>
                </button>
                <button mat-icon-button>
                    <mat-icon color="warn">delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
